name: CI

on:
  push:
    branches: [main, "phase*"]
  workflow_call: # also called by deploy.yml, which runs it for pull requests

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memory-trip-app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: memorytrip
          POSTGRES_PASSWORD: memorytrip
          POSTGRES_DB: memory_trip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memorytrip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The build never connects to this database; the tests use TEST_DATABASE_URL.
      DATABASE_URL: postgresql://memorytrip:memorytrip@localhost:5432/memory_trip
      TEST_DATABASE_URL: postgresql://memorytrip:memorytrip@localhost:5432/memory_trip_test
      SESSION_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: memory-trip-app/package-lock.json
      - run: npm ci
      # Fails on known high/critical vulnerabilities (this is what flags an outdated Next.js).
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
